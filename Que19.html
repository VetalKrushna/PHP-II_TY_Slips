<!--19. To insert text before and after
an image using
jQuery. [Hint : Use
before( ) and after( )]
-->

<html>
    <head>
        <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    </head>
    <body><!--Download the image-->
        <img src="a.jpeg">
        <script>
            $("img").before("<p>Text before image</p>");
            $("img").after("<p>Text after image</p>");
        </script>
    </body>
</html>
