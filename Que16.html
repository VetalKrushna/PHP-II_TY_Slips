<!--
16. Write a javascript to display message ‘Exams are near, have you started
preparing for?’ using alert, prompt and confirm boxes. Accept proper input
from user and display messages accordingly.
-->

<html>
  <body>
  <script>
    var ans=prompt("'Have you started preparing for? :(Yes/No):'")
        con=confirm("Are you sure.");
        if(con==true && ans=="Yes")
        {
         alert("Best of Luck!..");
        }
        else
        {
          alert("Please start preparing soon...");
        } 
</script>
</body>
</html>
